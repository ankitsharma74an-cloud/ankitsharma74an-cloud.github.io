<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Instagram</title>
  <desc id="desc">Instagram camera mark with the brand gradient and white camera glyph.</desc>
  <defs>
    <linearGradient id="instagram-gradient" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#FEDA75"/>
      <stop offset="25%" stop-color="#FA7E1E"/>
      <stop offset="55%" stop-color="#D62976"/>
      <stop offset="78%" stop-color="#962FBF"/>
      <stop offset="100%" stop-color="#4F5BD5"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#instagram-gradient)"/>
  <rect x="124" y="124" width="264" height="264" rx="76" fill="none" stroke="#FFFFFF" stroke-width="36"/>
  <circle cx="256" cy="256" r="65" fill="none" stroke="#FFFFFF" stroke-width="36"/>
  <circle cx="340" cy="184" r="17" fill="#FFFFFF"/>
</svg>
